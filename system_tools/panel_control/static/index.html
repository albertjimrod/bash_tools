<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de control</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #dde1e6;
    --text: #1a1d21;
    --text-muted: #5b6270;
    --accent: #2f6fed;
    --good: #1c9d5b;
    --good-bg: #e5f6ec;
    --warn: #b5750a;
    --warn-bg: #fdf1de;
    --bad: #c23a3a;
    --bad-bg: #fbe9e9;
    --off: #8a919e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f25;
      --surface-2: #23262d;
      --border: #2e323b;
      --text: #eaecef;
      --text-muted: #99a0ad;
      --accent: #5b8cf5;
      --good: #35c07c;
      --good-bg: #123825;
      --warn: #dba03f;
      --warn-bg: #3a2c10;
      --bad: #e0605f;
      --bad-bg: #3a1616;
      --off: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 1.3rem; letter-spacing: -0.01em; }
  #refresh-status { font-size: 0.8rem; color: var(--text-muted); }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  section h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 0.7rem;
    padding: 1px 7px;
    border-radius: 100px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
  }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .card.remote { border-left: 3px solid var(--bad); }
  .card-info { min-width: 0; }
  .card-info .name { font-weight: 600; font-size: 0.92rem; }
  .card-info .unit { font-size: 0.72rem; color: var(--text-muted); font-family: ui-monospace, monospace; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--off);
  }
  .status-dot.on { background: var(--good); }
  .status-dot.off { background: var(--off); }
  .status-row { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  button.toggle {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.toggle:hover { border-color: var(--accent); }
  button.toggle:disabled { opacity: 0.5; cursor: wait; }
  button.toggle.start { color: var(--good); }
  button.toggle.stop { color: var(--bad); }
  .url-link {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.72rem;
    font-family: ui-monospace, monospace;
    color: var(--accent);
    text-decoration: none;
    margin-top: 3px;
  }
  .url-link:hover { text-decoration: underline; }
  .url-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .info-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .info-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    display: flex;
    gap: 6px;
    align-items: center;
    color: var(--text-muted);
  }
  .info-pill b { color: var(--text); font-weight: 600; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 1.25rem; font-weight: 700; margin-top: 2px; }
  .stat .sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .stat.warn .value { color: var(--warn); }
  .stat.bad .value { color: var(--bad); }
  .group-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    display: none;
    max-width: 90vw;
  }
  .empty { color: var(--text-muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>Panel de control</h1>
  <span id="refresh-status">cargando…</span>
</header>

<main>
  <section>
    <h2>⚠ Accesos remotos <span id="remote-badge" class="badge"></span></h2>
    <div id="remote-access" class="card-grid"></div>
  </section>

  <section>
    <h2>Servicios y herramientas</h2>
    <div id="services" class="card-grid"></div>
  </section>

  <section id="skills-section" hidden>
    <h2>Skills de agente (Claude Code) <span id="skills-badge" class="badge"></span></h2>
    <div id="skills" class="card-grid"></div>
  </section>

  <section>
    <h2>Solo información</h2>
    <div id="info-only" class="info-list"></div>
  </section>

  <section>
    <h2>Contenedores Docker</h2>
    <div id="containers"></div>
  </section>

  <section>
    <h2>Proyectos Docker Compose</h2>
    <p class="empty" style="margin:-4px 0 10px">Stacks completos que no siempre tienes arrancados como contenedores.</p>
    <div id="compose" class="card-grid"></div>
  </section>

  <section>
    <h2>Estado del sistema</h2>
    <div id="system" class="stat-grid"></div>
  </section>
</main>

<div id="toast"></div>

<script>
const REFRESH_MS = 5000;
let inFlight = new Set();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.style.display = 'none', 4000);
}

const TOGGLE_ENDPOINT = {
  unit: '/api/service/toggle',
  docker: '/api/docker/toggle',
  compose: '/api/compose/toggle',
  skill: '/api/skill/toggle',
};
const TOGGLE_KEY_FIELD = { unit: 'unit', docker: 'name', compose: 'id', skill: 'name' };

async function toggle(kind, key, action) {
  if (inFlight.has(key)) return;
  inFlight.add(key);
  render();
  try {
    const body = { [TOGGLE_KEY_FIELD[kind]]: key, action };
    const res = await fetch(TOGGLE_ENDPOINT[kind], { method: 'POST', body: JSON.stringify(body) });
    const data = await res.json();
    if (!data.ok) showToast(`Error: ${data.error}`);
  } catch (e) {
    showToast(`Error de red: ${e}`);
  } finally {
    inFlight.delete(key);
    await refresh();
  }
}

function urlLink(url) {
  return `<a class="url-link" href="${url}" target="_blank" rel="noopener">${url.replace('http://', '')} ↗</a>`;
}

function toggleButton(kind, key, running, labelOn, labelOff) {
  const busy = inFlight.has(key);
  const action = running ? 'stop' : 'start';
  const btn = document.createElement('button');
  btn.className = `toggle ${busy ? '' : action}`;
  btn.textContent = busy ? '...' : (running ? labelOn : labelOff);
  btn.disabled = busy;
  btn.addEventListener('click', () => toggle(kind, key, action));
  return btn;
}

function unitCard(s, remote) {
  const div = document.createElement('div');
  div.className = 'card' + (remote ? ' remote' : '');
  div.innerHTML = `
    <div class="card-info">
      <div class="name"><span class="status-dot ${s.active ? 'on' : 'off'}"></span>${s.label}</div>
      <div class="unit">${s.unit}</div>
      <div class="status-row">${s.active ? 'Activo' : 'Inactivo'} · arranque automático: ${s.enabled ? 'sí' : 'no'}</div>
      ${s.url ? urlLink(s.url) : '<div class="status-row" style="opacity:.6">sin interfaz web</div>'}
    </div>
  `;
  div.appendChild(toggleButton('unit', s.unit, s.active, 'Desactivar', 'Activar'));
  return div;
}

function containerCard(c) {
  const div = document.createElement('div');
  div.className = 'card';
  const urls = (c.urls && c.urls.length)
    ? `<div class="url-list">${c.urls.map(urlLink).join('')}</div>`
    : '';
  div.innerHTML = `
    <div class="card-info">
      <div class="name"><span class="status-dot ${c.running ? 'on' : 'off'}"></span>${c.name}</div>
      <div class="unit">${c.image}</div>
      <div class="status-row">${c.status}</div>
      ${urls}
    </div>
  `;
  div.appendChild(toggleButton('docker', c.name, c.running, 'Parar', 'Arrancar'));
  return div;
}

function composeCard(p) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <div class="card-info">
      <div class="name"><span class="status-dot ${p.running ? 'on' : 'off'}"></span>${p.label}</div>
      <div class="status-row">${p.running ? 'Arrancado' : 'Parado'}</div>
      ${urlLink(p.url)}
      ${p.note ? `<div class="status-row" style="opacity:.7">${p.note}</div>` : ''}
    </div>
  `;
  div.appendChild(toggleButton('compose', p.id, p.running, 'Parar', 'Arrancar'));
  return div;
}

function agentReachCard(ar) {
  const div = document.createElement('div');
  div.className = 'card';
  const ch = ar.channels;
  const chLine = (ar.skill_active && ch)
    ? `<div class="status-row">${ch.ready}/${ch.total} canales listos${ch.ready_names.length ? ': ' + ch.ready_names.join(', ') : ''}</div>`
    : '';
  div.innerHTML = `
    <div class="card-info">
      <div class="name"><span class="status-dot ${ar.skill_active ? 'on' : 'off'}"></span>Agent Reach</div>
      <div class="unit">skill Claude Code${ar.version ? ' · ' + ar.version : ''}</div>
      <div class="status-row">${ar.skill_active ? 'Instalada — Claude puede usarla (reinicia Claude Code tras cambiarla)' : 'No instalada'}</div>
      ${chLine}
    </div>
  `;
  div.appendChild(toggleButton('skill', 'agent-reach', ar.skill_active, 'Desactivar', 'Activar'));
  return div;
}

function groupKey(name) {
  const m = name.match(/^([a-zA-Z0-9]+)[-_]/);
  return m ? m[1] : name;
}

let lastData = null;

function render() {
  const data = lastData;
  if (!data) return;

  const remoteEl = document.getElementById('remote-access');
  remoteEl.innerHTML = '';
  data.remote_access.forEach(s => remoteEl.appendChild(unitCard(s, true)));
  const activeRemote = data.remote_access.filter(s => s.active).length;
  const badge = document.getElementById('remote-badge');
  badge.textContent = `${activeRemote} de ${data.remote_access.length} activos`;
  badge.className = 'badge ' + (activeRemote > 0 ? 'bad' : 'good');

  const servicesEl = document.getElementById('services');
  servicesEl.innerHTML = '';
  data.services.forEach(s => servicesEl.appendChild(unitCard(s, false)));

  const ar = data.agent_reach;
  const skillsSection = document.getElementById('skills-section');
  const skillsEl = document.getElementById('skills');
  const skillsBadge = document.getElementById('skills-badge');
  skillsEl.innerHTML = '';
  if (!ar) {
    skillsSection.hidden = true;
  } else {
    skillsSection.hidden = false;
    skillsEl.appendChild(agentReachCard(ar));
    if (ar.skill_active && ar.channels) {
      skillsBadge.textContent = `${ar.channels.ready} de ${ar.channels.total} canales`;
      skillsBadge.className = 'badge ' + (ar.channels.ready > 0 ? 'good' : 'bad');
    } else {
      skillsBadge.textContent = ar.skill_active ? 'activa' : 'desactivada';
      skillsBadge.className = 'badge ' + (ar.skill_active ? 'good' : 'bad');
    }
  }

  const infoEl = document.getElementById('info-only');
  infoEl.innerHTML = '';
  data.info_only.forEach(s => {
    const pill = document.createElement('div');
    pill.className = 'info-pill';
    pill.innerHTML = `<span class="status-dot ${s.active ? 'on' : 'off'}"></span>${s.label}: <b>${s.active ? 'activo' : 'inactivo'}</b>`;
    infoEl.appendChild(pill);
  });

  const containersEl = document.getElementById('containers');
  containersEl.innerHTML = '';
  if (data.containers.length === 0) {
    containersEl.innerHTML = '<div class="empty">Docker no responde o no hay contenedores.</div>';
  } else {
    const groups = {};
    data.containers.forEach(c => {
      const g = groupKey(c.name);
      (groups[g] = groups[g] || []).push(c);
    });
    Object.keys(groups).sort().forEach(g => {
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = g;
      containersEl.appendChild(label);
      const grid = document.createElement('div');
      grid.className = 'card-grid';
      groups[g].forEach(c => grid.appendChild(containerCard(c)));
      containersEl.appendChild(grid);
    });
  }

  const composeEl = document.getElementById('compose');
  composeEl.innerHTML = '';
  (data.compose_projects || []).forEach(p => composeEl.appendChild(composeCard(p)));

  const sys = data.system;
  const sysEl = document.getElementById('system');
  const diskWarn = sys.disk_pct && parseInt(sys.disk_pct) >= 85;
  sysEl.innerHTML = `
    <div class="stat">
      <div class="label">Carga</div>
      <div class="value">${sys.load || '?'}</div>
      <div class="sub">${sys.uptime || ''}</div>
    </div>
    <div class="stat">
      <div class="label">RAM</div>
      <div class="value">${sys.mem_used || '?'} / ${sys.mem_total || '?'}</div>
      <div class="sub">${sys.mem_available || '?'} disponible</div>
    </div>
    <div class="stat ${diskWarn ? 'warn' : ''}">
      <div class="label">Disco (/)</div>
      <div class="value">${sys.disk_pct || '?'}</div>
      <div class="sub">${sys.disk_used || '?'} / ${sys.disk_total || '?'}</div>
    </div>
    ${sys.gpu ? `
    <div class="stat">
      <div class="label">GPU</div>
      <div class="value">${sys.gpu.util}% · ${sys.gpu.temp}°C</div>
      <div class="sub">${sys.gpu.mem_used} / ${sys.gpu.mem_total} MiB</div>
    </div>` : ''}
    <div class="stat ${parseInt(sys.pending_updates || 0) > 0 ? 'warn' : ''}">
      <div class="label">Actualizaciones</div>
      <div class="value">${sys.pending_updates || '0'}</div>
      <div class="sub">pendientes (apt)</div>
    </div>
    <div class="stat ${sys.firewall_active ? '' : 'bad'}">
      <div class="label">Firewall</div>
      <div class="value">${sys.firewall_active ? 'Activo' : 'Inactivo'}</div>
    </div>
  `;

  document.getElementById('refresh-status').textContent =
    'actualizado ' + new Date().toLocaleTimeString('es-ES');
}

async function refresh() {
  try {
    const res = await fetch('/api/status');
    lastData = await res.json();
  } catch (e) {
    document.getElementById('refresh-status').textContent = 'sin conexión con el panel';
    return;
  }
  render();
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
